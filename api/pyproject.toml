[build-system]
requires = ["setuptools>=77"]
# In-tree wrapper: it only VERIFIES that the packaged web UI is present and current, and never runs
# npm, so installing this package never needs Node.
build-backend = "kotoba_build"
backend-path = ["."]

[project]
name = "kotoba-companion"
description = "An AI companion you can talk to, that can actually do things."
# Its own short page, not the repository's: without one the project page on PyPI is blank but for the
# line above, and a copy of a decorated README would be two things to keep in step.
readme = "README.md"
license = "MIT"
# The text, not only the name: MIT asks that the notice travel with the software, and the bundled
# JavaScript carries an Apache-2.0 obligation of its own. Copies of the repo-root originals, held
# byte-identical by a test, because the manifest cannot reach outside its own directory.
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
# THE floor, and the only one: doctor refuses anything older by the same number. The image's own
# 3.14 is a supported choice, not a second floor.
requires-python = ">=3.11"
authors = [{ name = "Rodney Dhavid Jimenez Chacin" }]
keywords = ["ai", "agent", "companion", "vtuber", "live2d", "voice", "elevenlabs"]
classifiers = [
    # The leading zero in the version is a claim about how settled this is, and PyPI prints this
    # classifier right beside it. Saying Stable there contradicts the number in the same box.
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dynamic = ["version"]

# The engine: the agentic loop, tools, memory, keystore. Proven to run a full turn with no HTTP server.
dependencies = [
    "aiosqlite>=0.20",
    "cryptography>=42",
    "httpx>=0.27",
    "openai>=2,<3",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# fastapi/starlette are imported by kotoba.server and nowhere else, so the CLI installs without them.
server = ["fastapi>=0.115", "pydantic>=2.9", "uvicorn[standard]>=0.32"]
voice = ["websockets>=16,<18"]
# The ceiling is the point: mcp 2.0 renamed Tool.inputSchema, which silently degrades the
# anti-injection schema scan to a no-op and breaks every MCP tool conversion.
mcp = ["mcp>=1.27,<2"]
# lxml is readability-lxml's backend and would come in transitively; the floor is declared anyway so
# pip resolves to a release with prebuilt wheels instead of trying to compile libxml2 on the user's box.
web = ["readability-lxml>=0.8.1", "lxml>=5.0"]
# pillow renders her portrait; without it the terminal simply drops a rung to the kaomoji.
cli = ["prompt_toolkit>=3.0.52", "rich>=15", "pillow>=10"]
# The voice extra of discord.py brings PyNaCl and the DAVE codec with it, so only these two are named.
# numpy resamples between Discord's 48 kHz stereo and what the transcriber wants.
discord = ["kotoba-companion[voice]", "discord.py[voice]>=2.7.1,<3", "numpy>=1.26"]
dev = ["kotoba-companion[server,voice,mcp,web,cli,discord]", "pytest>=8", "pytest-timeout>=2.3"]

[project.urls]
Homepage = "https://github.com/rodhnin/kotoba-companion"
Source = "https://github.com/rodhnin/kotoba-companion"

[project.scripts]
kotoba = "kotoba.cli.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "kotoba.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

# Runtime data the wheel carries: copies of the repo-root originals, held byte-identical by a test
# that also refuses a file these patterns would miss.
[tool.setuptools.package-data]
kotoba = [
    "data/soul/*.md",
    "data/soul/*.html",
    "data/soul/*.webp",
    "data/soul/skills/*.md",
    "data/soul/templates/*.md",
    "data/cli/faces/*.png",
    "web/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# A stranger running `pytest` must not make an outbound connection they did not ask for. The tests that
# fetch and then RUN somebody else's package — an MCP server off the npm registry, a container image —
# carry `network` and are deselected here. Because a command-line -m replaces this line, they also
# refuse to run unless KOTOBA_ALLOW_NETWORK=1 says so: `KOTOBA_ALLOW_NETWORK=1 pytest -m network`.
markers = ["network: leaves this machine; deselected by default, run with -m network and KOTOBA_ALLOW_NETWORK=1"]
# A guard that HANGS is not a red test: on a runner it is a cancelled job, and locally it is a
# green summary that never returns. Twenty-one waits in the suite have no bound of their own.
timeout = 120
addopts = "-m 'not network'"
