# Running `pytest` from the repository root instead of from api/.
#
# The Python suite lives in api/tests, and its settings are declared in api/pyproject.toml under
# [tool.pytest.ini_options] — that file is authoritative. But pytest only reads it when api/ is the
# rootdir, so a contributor who clones and types `pytest` at the top got a rootdir with no config at
# all: the suite's testpaths were ignored, the `network` marker was unregistered, and the tests that
# fetch and run somebody else's package ran instead of being deselected. A clean clone must not reach
# the internet because of which directory someone happened to be standing in. Those tests carry a
# second, independent gate for the same reason, since a `-m` typed here replaces this line.
#
# pytest has no include directive, so these settings are repeated rather than referenced. Keeping them
# identical to api/pyproject.toml is a test, not a hope: the one invocation this file exists to protect
# is the one that would otherwise miss whatever the authoritative file gained.
[pytest]
testpaths = api/tests
markers = network: leaves this machine; deselected by default, run with -m network and KOTOBA_ALLOW_NETWORK=1
timeout = 120
addopts = -m 'not network'
